        <p style="font-size:14px;line-height:1.65">브라우저 설정에서 자바스크립트를 켠 뒤 다시 열어 주세요.</p>

    <script>
      (function () {
        var panel = document.getElementById('cc-boot-failure');
        var detail = document.getElementById('cc-boot-detail');
        var notes = [];
        var shown = false;

        // **화면이 비어 있을 때만** 실패로 판정한다.
        // 이 판정을 느슨하게 잡으면 멀쩡히 뜬 앱 위에 전면 패널이 덮여 조작을 가로막는다 —
        // 실제로 처음 판에서 그렇게 만들었고 회귀 스위트가 잡아냈다. 자산 하나가 못 떠도
        // 앱이 그려졌으면 그건 실패가 아니다(예: OCR 런타임은 없어도 앱은 동작한다).
        function booted() {
          var root = document.getElementById('root');
          return !!root && root.childElementCount > 0;
        }

        function show(reason) {
          if (shown || booted()) return;
          shown = true;
          notes.unshift(reason);
          var script = document.querySelector('script[type="module"][src]');
          notes.push('build: ' + (script ? script.getAttribute('src') : '(script 태그 없음)'));
          notes.push('ua: ' + navigator.userAgent);
          detail.textContent = notes.join('\n');
          panel.setAttribute('data-open', '1');
        }

        var timer = setTimeout(function () { show('화면이 12초 안에 뜨지 않았어요.'); }, 12000);

        window.addEventListener('error', function (event) {
          var target = event.target;
          var isResource = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          if (!isResource) {
            if (event.message) notes.push('error: ' + event.message);
            return;
          }
          var address = target.src || target.href || '';
          notes.push('resource: ' + address);
          // 앱의 진입 스크립트가 못 뜬 경우에만 12초를 기다리지 않는다. 이때는 앱이 뜰 길이 없다.
          // 그래도 곧바로 덮지는 않는다 — 다른 경로로 이미 그려졌을 수 있으므로 한 박자 두고 다시 본다.
          if (target === document.querySelector('script[type="module"][src]')) {
            clearTimeout(timer);
            setTimeout(function () { show('앱 파일을 받지 못했어요: ' + (address || '(주소 없음)')); }, 1200);
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          notes.push('rejection: ' + String(event.reason).slice(0, 200));
        });

        document.getElementById('cc-boot-reset').addEventListener('click', function () {
          var button = document.getElementById('cc-boot-reset');
          button.disabled = true;
          button.textContent = '비우는 중…';
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (all) {
              return Promise.all(all.map(function (registration) { return registration.unregister(); }));
            }).catch(function () {}));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            }).catch(function () {}));
          }
          Promise.all(jobs).then(function () {
            // 주소는 그대로 둔다(개인 링크 코드 포함). 캐시만 우회해 다시 받는다.
            var url = new URL(location.href);
            url.searchParams.set('cc_fresh', String(Date.now()));
            location.replace(url.href);
          });
        });
      }());
    </script>
