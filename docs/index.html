<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <meta name="description" content="Kairen Card Capture 모바일 명함 캡처">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>명함 캡처</title>
</head>
<body>
  <main>
    <p>새 명함 캡처 앱을 여는 중입니다.</p>
    <p><a id="continue" href="next/">계속하기</a> · <a href="legacy.html">이전 앱 열기</a></p>
  </main>
  <script>
    (function () {
      var moved = false;
      var destination = new URL('next/', location.href);
      destination.search = location.search;
      destination.hash = location.hash;
      document.getElementById('continue').href = destination.href;

      function openApp() {
        if (moved) return;
        moved = true;
        location.replace(destination.href);
      }

      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        navigator.serviceWorker.register('sw.js').catch(function () {}).then(openApp);
        setTimeout(openApp, 1500);
      } else {
        openApp();
      }
    }());
  </script>
</body>
</html>
