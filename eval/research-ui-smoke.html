<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Research instruction UI smoke</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #dfe7ef; font-family: system-ui, sans-serif; }
    main { display: grid; place-items: start center; padding: 20px; }
    iframe { width: 390px; height: 844px; border: 0; border-radius: 24px; box-shadow: 0 18px 60px rgba(16,35,61,.24); background: white; }
  </style>
</head>
<body>
  <main><iframe id="phone" title="Card Capture owner research instruction preview" src="../docs/index.html"></iframe></main>
  <script>
    document.getElementById('phone').addEventListener('load', function () {
      var w = this.contentWindow;
      w.document.getElementById('nameOverlay').classList.remove('show');
      w.document.getElementById('setupBanner').style.display = 'none';
      w.briefSeeAll = true;
      w.researchInstructionEnabled = true;
      w.applyResearchCapability();
      w.setContextInputTab('research');
      w.renderBriefs([{
        captureId: '20260725-171500-smok',
        capturedAt: '2026-07-25T08:15:00.000Z',
        status: 'processed',
        person: 'PER-999999',
        type: 'capture',
        contact: { name: '테스트 사람', organization: '합성 회사', title: '대표', emails: [], phones: [] },
        brief: '# 테스트 사람 — 이런 분이에요\n\n공개 자료 기반 합성 브리핑'
      }]);
    });
  </script>
</body>
</html>
