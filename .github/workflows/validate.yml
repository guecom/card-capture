name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # 릴리즈 tag까지 받아 온다. eval/version-sync.test.js가 "CHANGELOG에 기록되지 않은
          # 릴리즈 tag"를 잡으려면 tag가 보여야 한다. 얕은 clone이면 그 검사는 pass가 아니라
          # 미검증으로 남는다 — 조용한 통과가 이 게이트가 막으려는 실패 양식이기 때문이다.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            watcher/push/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Install Web Push sender dependencies
        run: npm ci --prefix watcher/push

      - name: Audit Web Push sender dependencies
        run: npm audit --prefix watcher/push --audit-level=high

      - name: Verify committed Pages bundle matches source identity
        run: node eval/pages-bundle-freshness.test.js

      - name: Test and build React candidate
        run: npm run validate --prefix frontend

      - name: Verify server-off recovery in Chrome
        run: npm run test:e2e --prefix frontend

      - name: Validate repository contracts
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/validate.ps1
